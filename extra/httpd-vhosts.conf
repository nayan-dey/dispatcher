<VirtualHost *:8080>
    ServerName brand1.local

    DocumentRoot "/opt/homebrew/var/www/html/brand1"

    <Directory "/opt/homebrew/var/www/html/brand1">
        Options Indexes FollowSymLinks Includes
        AllowOverride None
        Require all granted
    </Directory>

    <Location />
        Options +Includes
        AddOutputFilter INCLUDES .html
    </Location>
</VirtualHost>

<VirtualHost *:8080>
    ServerName brand2.local

    DocumentRoot "/opt/homebrew/var/www/html/brand2"

    <Directory "/opt/homebrew/var/www/html/brand2">
        Options Indexes FollowSymLinks Includes
        AllowOverride None
        Require all granted

        AddOutputFilter INCLUDES .html
    </Directory>
</VirtualHost>
